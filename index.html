        .tech-table th{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--sub);text-align:left;padding:8px;border-bottom:1px solid var(--border)}
        .tech-table td{padding:10px 8px;border-bottom:1px solid var(--border);color:var(--text);line-height:1.4}
        .tech-table td:first-child{color:var(--sub);font-size:11px;letter-spacing:1px;text-transform:uppercase;width:70px}
        .compliance{display:flex;flex-direction:column;gap:8px}
        .comp-item{padding:10px 12px;border-radius:10px;background:rgba(106,84,32,0.08);border:1px solid rgba(196,165,85,0.18);font-size:11px;color:var(--sub);display:flex;gap:8px}
        .comp-item b{color:var(--gold2)}
        /* Playbook */
        .search{width:100%;padding:12px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:13px;outline:none}
        .search:focus{border-color:var(--gold)}
        .play-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px;max-width:100%}
        /* Standards */
        .std-hero{border-radius:16px;border:1px solid var(--border);background:linear-gradient(135deg,#12100E,#1A1810);padding:22px;max-width:100%}
        .std-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px;max-width:100%}
        .std-card{border-radius:14px;border:1px solid var(--border);background:var(--surface2);padding:16px}
        .std-card h4{margin:0 0 8px;font-family:Georgia, serif;font-size:18px}
        .std-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
        .std-list li{font-size:12px;color:var(--sub);line-height:1.4;display:flex;gap:8px}
        .std-list li:before{content:"—";color:var(--gold2)}
        .dont{border-color:rgba(200,60,60,0.22);background:rgba(40,14,14,0.5)}
        /* Toast */
        .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,var(--gold2),var(--gold));color:#0A0804;padding:10px 18px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;box-shadow:0 8px 24px rgba(196,165,85,0.35);z-index:60;animation:pop 200ms ease}
        @keyframes pop{from{transform:translateX(-50%) translateY(8px) scale(0.96);opacity:0}to{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
        /* Mobile */
        .hamburger{display:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer}
        .overlay{display:none}
        @media(max-width:1024px){
          .sidebar{position:fixed;left:0;top:60px;z-index:40;transform:translateX(-100%);transition:280ms;box-shadow:20px 0 40px rgba(0,0,0,0.5)}
          .sidebar.open{transform:translateX(0)}
          .overlay{display:block;position:fixed;inset:60px 0 0 0;background:rgba(0,0,0,0.5);backdrop-filter:blur(2px);z-index:35}
          .main{padding:16px;max-width:100vw}
          .hero-grid{grid-template-columns:1fr}
          .stats{grid-template-columns:repeat(3,1fr)}
          .overview-cols{grid-template-columns:1fr}
          .materials{grid-template-columns:1fr 1fr}
          .tiktok-grid{grid-template-columns:1fr 1fr}
          .play-grid{grid-template-columns:1fr}
          .std-grid{grid-template-columns:1fr}
          .right{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:86vh;border-radius:20px 20px 0 0;border:1px solid var(--border);border-bottom:0;transform:translateY(100%)}
          .right.open{transform:translateY(0)}
          .right.hidden{transform:translateY(100%);width:100%;height:0}
          .hamburger{display:grid;place-items:center}
          .cal-wrap{overflow-x:auto;max-width:100vw}
          .cal-inner{min-width:640px}
        }
        @media(max-width:640px){
          .stats{grid-template-columns:repeat(2,1fr)}
          .materials{grid-template-columns:1fr}
          .tiktok-grid{grid-template-columns:1fr}
          .hero-title{font-size:32px}
        }
